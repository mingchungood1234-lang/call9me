// Call9me for Android (Kotlin). The UI is the Call9me website in a WebView; the app adds what
// a website can't do: calls ring with the app closed (Firebase push + full-screen call screen),
// calls keep going in the background (foreground service), native permissions, splash and bars.
// Build it with `npm run android:build` (see android/README.md).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firebase: download google-services.json from the Firebase console into this folder.
// Without it the app still works, but calls can't ring while the app is closed.
def firebase = file('google-services.json').exists()
if (firebase) {
    apply plugin: 'com.google.gms.google-services'
}

// The site the app opens, e.g. `-PtwaHost=call.example.com` (hostname only, HTTPS is implied).
def siteHost = (findProperty('twaHost') ?: System.getenv('TWA_HOST') ?: 'call.example.com').toString()
def appId = (findProperty('applicationId') ?: 'com.call9me.app').toString()

// Release signing key, created on the first `npm run android:build` (keep it safe: updates
// must be signed with the same key, or users have to uninstall first).
def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.call9me.app'
    compileSdk 36

    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 36
        versionCode((findProperty('versionCode') ?: '1').toString().toInteger())
        versionName((findProperty('versionName') ?: '1.0.0').toString())

        buildConfigField 'String', 'SITE_HOST', "\"${siteHost}\""
        buildConfigField 'boolean', 'FIREBASE', firebase.toString()
        manifestPlaceholders = [hostName: siteHost]

        // Native calls (WebRTC) ship a native library per CPU type: phones are ARM.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file("keystore/${keystoreProps['storeFile']}")
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.browser:browser:1.9.0'
    // Native calls: Google's WebRTC (prebuilt by Stream), and coroutines for its async steps.
    implementation 'io.getstream:stream-webrtc-android:1.3.8'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-messaging'
}
